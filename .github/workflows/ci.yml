name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file libxdo-dev libdbus-1-dev pkg-config

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # tauri.conf.json bundles the Go tsnet sidecar as an externalBin, and
      # tauri-build refuses to run until the per-triple binary exists.
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache-dependency-path: sidecar/cortex-tsnet/go.sum

      - name: Build tsnet sidecar
        shell: bash
        run: bash scripts/build-tsnet-sidecar.sh

      # --- Required gates (correctness) ---
      - name: TS typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Format check (prettier + rustfmt)
        run: pnpm format:check

      - name: Show formatting diff
        if: failure()
        shell: bash
        run: |
          pnpm exec prettier --write "src/**/*.{ts,tsx,css}" "mobile/src/**/*.{ts,tsx,css}" > /dev/null
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git --no-pager diff | head -300

      - name: Frontend build
        run: pnpm build

      # Bundled as a Tauri resource (mobile-dist/), so tauri-build needs it
      # to exist before cargo runs, same as the sidecar.
      - name: Mobile PWA build
        run: pnpm build:mobile

      - name: Rust build check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # --- Advisory gates (style) — reported but non-blocking ---
      - name: Rust clippy (advisory)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --message-format=short
        continue-on-error: true
